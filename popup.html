<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: Arial, sans-serif; width: 360px; margin: 0; padding: 12px; color: #222; font-size: 13px; }
    h1 { font-size: 17px; margin: 0 0 8px; }
    details { margin-bottom: 10px; }
    input[type="password"] { width: 100%; box-sizing: border-box; padding: 6px; margin-top: 6px; }
    button { padding: 7px 10px; cursor: pointer; width: 100%; margin-top: 6px; }
    label { display: block; margin-top: 8px; }
    .badge { color: #fff; border-radius: 10px; padding: 12px; text-align: center; margin-top: 10px; }
    .score { font-size: 40px; font-weight: bold; }
    .label { font-weight: bold; }
    .summary { font-weight: bold; margin: 10px 0 6px; }
    .small { font-size: 12px; color: #555; margin: 6px 0; word-break: break-all; }
    .reason { margin: 8px 0; padding: 8px; border-left: 3px solid #999; background: #f7f7f7; }
    .evidence { font-family: monospace; font-size: 11px; color: #444; word-break: break-all; margin-top: 4px; }
    .err { color: #b00020; }
  </style>
</head>
<body>
  <h1>Decepta Scam Shield</h1>

  <details>
    <summary>Settings (API key)</summary>
    <input type="password" id="apiKey" placeholder="Paste your Anthropic API key">
    <button id="saveKey">Save key</button>
  </details>

  <label for="file">Optional: add an attachment (PDF or image, up to 5 MB)</label>
  <input type="file" id="file" accept=".pdf,image/png,image/jpeg,image/webp,image/gif">

  <button id="analyze">Analyze this page or email</button>

  <div id="result"></div>
  <script src="popup.js"></script>
</body>
